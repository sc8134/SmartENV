[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartenv"
version = "1.0.0"
description = "Simple, powerful, zero-dependency configuration loader for Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ['tomli>=2.0; python_version < "3.11"']
authors = [{name = "SmartEnv Contributors", email = "smartenv@example.com"}]
maintainers = [{name = "SmartEnv Contributors", email = "smartenv@example.com"}]
keywords = ["config", "configuration", "env", "dotenv", "settings", "environment-variables", "toml", "json", "zero-dependency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Configuration Management",
]
urls = {Homepage = "https://github.com/sc8134/SmartENV", Repository = "https://github.com/sc8134/SmartENV", Issues = "https://github.com/sc8134/SmartENV/issues", Changelog = "https://github.com/sc8134/SmartENV/blob/main/CHANGELOG.md"}

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.1",
]
docs = ["sphinx>=7.0", "furo>=2023"]

[tool.setuptools.packages.find]
where = ["."]
include = ["smartenv*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.coverage.run]
branch = true
source = ["smartenv"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true
